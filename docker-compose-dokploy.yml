# Production Docker Compose with Named Volumes
# Data persists FOREVER in Docker-managed named volumes, safe for Dokploy

services:
  ts-crm-postgres:
    image: postgres:16-alpine
    container_name: ts-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-startup_mvp}
    volumes:
      # Named volume managed by Docker (safe for Dokploy)
      - ts-crm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-network

  ts-crm-app:
    build:
      context: ./startup-mvp
      dockerfile: Dockerfile
    container_name: ts-crm-app
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - ts-crm-uploads-data:/app/uploads
      - ts-crm-backups-data:/app/backups
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@ts-crm-postgres:5432/${POSTGRES_DB:-startup_mvp}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      
      # File Storage
      UPLOAD_DIR: /app/uploads
      
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://ts-crm-redis:6379}
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Startup MVP}
      
      # App URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-e1eaea238e6961fbb3f37c0bd2989d0dfd5c3279884aad0b88ef3c024d17c9db}
      BACKUP_ENCRYPTION_ENABLED: ${BACKUP_ENCRYPTION_ENABLED:-true}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
      NODE_ENV: production
    depends_on:
      ts-crm-postgres:
        condition: service_healthy
    networks:
      - docker-network
      - dokploy-network

  ts-crm-redis:
    image: redis:7-alpine
    container_name: ts-crm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      # Named volume for Redis
      - ts-crm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-network

networks:
  docker-network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  ts-crm-postgres-data:
  ts-crm-uploads-data:
  ts-crm-backups-data:
  ts-crm-redis-data:
