services:
  espacio-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
      

  espacio-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dokploy-network
      

  espacio-minio-setup:
    image: minio/mc:latest
    depends_on:
      espacio-minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set myminio http://espacio-minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb myminio/${MINIO_BUCKET_NAME} || true &&
      mc anonymous set download myminio/${MINIO_BUCKET_NAME} || true
      "
    networks:
      - dokploy-network
      

  espacio-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
      

  espacio-app:
    build:
      context: ./startup-mvp
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.espacio-app.rule=Host(`app.espaciobd.com`)"
      - "traefik.http.routers.espacio-app.entrypoints=websecure"
      - "traefik.http.routers.espacio-app.tls=true"
      - "traefik.http.services.espacio-app.loadbalancer.server.port=3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@espacio-postgres:5432/${POSTGRES_DB}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: https://app.espaciobd.com
      NEXT_PUBLIC_APP_URL: https://app.espaciobd.com
      MINIO_ENDPOINT: espacio-minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_PUBLIC_URL: https://app.espaciobd.com
      REDIS_URL: redis://espacio-redis:6379
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    depends_on:
      espacio-postgres:
        condition: service_healthy
      espacio-minio:
        condition: service_healthy
    command: >
      sh -c "
      echo 'Running Prisma migrations...' &&
      prisma migrate deploy || echo 'No new migrations or already applied' &&
      echo 'Generating Prisma client...' &&
      prisma generate &&
      echo 'Starting app...' &&
      node server.js
      "
    
    networks:
      - dokploy-network
      

networks:
  dokploy-network:
    external: true
    name: dokploy-network

volumes:
  postgres_data: {}
  minio_data: {}
  redis_data: {}
