# Load environment variables from .env.docker if it exists
# Otherwise, use default values or environment variables
# To use custom env file: docker-compose --env-file .env.docker up

services:
  # PostgreSQL Database
  fferp-postgres:
    image: postgres:16-alpine
    container_name: fferp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgresUser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgresPass}
      POSTGRES_DB: ${POSTGRES_DB:-startup_mvp}
      TZ: Asia/Dhaka
    expose:
      - "5432"
    volumes:
      # IMPORTANT: Data persists across deployments via named volumes
      # Docker manages this volume independently of the project folder
      - fferp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgresUser}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-network

  # Next.js Application
  fferp-app:
    build:
      context: ./startup-mvp
      dockerfile: Dockerfile
    container_name: fferp-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      TZ: Asia/Dhaka
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgresUser}:${POSTGRES_PASSWORD:-postgresPass}@fferp-postgres:5432/${POSTGRES_DB:-startup_mvp}?schema=public
      
      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-I5p97Jpv0Xr7Zz7Ay8W6+O2eLmBR6N2gllGrZO01Szo=}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET:-I5p97Jpv0Xr7Zz7Ay8W6+O2eLmBR6N2gllGrZO01Szo=}}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Auth.js v5 uses AUTH_URL / AUTH_TRUST_HOST – mirror NEXTAUTH_URL and trust the Docker host
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      
      # Redis (optional)
      REDIS_URL: ${REDIS_URL:-redis://fferp-redis:6379}
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Startup MVP}
      
      # App URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      
      # Biometric Synchronization API Key
      BIOMETRIC_API_KEY: ${BIOMETRIC_API_KEY:-default-secret-key}
      
      # Node Environment
      NODE_ENV: production
    volumes:
      - fferp-uploads-data:/app/uploads
    depends_on:
      fferp-postgres:
        condition: service_healthy
    networks:
      - docker-network
      - dokploy-network
    
  # Redis (optional, if you're using it)
  fferp-redis:
    image: redis:7-alpine
    container_name: fferp-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - fferp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-network

networks:
  docker-network:
    driver: bridge
  dokploy-network:
    external: true

# CRITICAL: Named volumes for data persistence
# These volumes are managed by Docker and safely survive Dokploy redeployments.
# They will NEVER be deleted during normal deployments unless explicitly destroyed.
volumes:
  fferp-postgres-data:
    driver: local
  fferp-uploads-data:
    driver: local
  fferp-redis-data:
    driver: local

