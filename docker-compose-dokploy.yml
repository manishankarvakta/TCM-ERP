version: '3.8'

services:
  # PostgreSQL Database - Isolated, no host ports
  postgres:
    image: postgres:16-alpine
    container_name: espacio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-espaciodb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

  # MinIO Object Storage - Isolated, no host ports
  minio:
    image: minio/minio:latest
    container_name: espacio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - dokploy-network

  # MinIO Bucket Setup - Creates bucket on startup
  minio-setup:
    image: minio/mc:latest
    container_name: espacio-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-espacio-files} --ignore-existing;
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_NAME:-espacio-files};
      echo '✓ MinIO bucket configured successfully';
      exit 0;
      "
    networks:
      - dokploy-network

  # Redis Cache - Isolated, no host ports
  redis:
    image: redis:7-alpine
    container_name: espacio-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

  # Next.js Application - Only service exposed via Dokploy
  app:
    build:
      context: ./startup-mvp
      dockerfile: Dockerfile
    container_name: espacio-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Server Configuration - Critical for Docker networking
      HOST: "0.0.0.0"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      
      # Database Connection
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-espaciodb}?schema=public"
      
      # NextAuth Configuration
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-to-a-secure-random-string-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://app.espaciobd.com}
      AUTH_TRUST_HOST: "true"
      
      # MinIO Configuration
      MINIO_ENDPOINT: "minio"
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-espacio-files}
      MINIO_PUBLIC_URL: "http://minio:9000"
      
      # Redis Configuration
      REDIS_URL: "redis://default:${REDIS_PASSWORD:-redis123}@redis:6379"
      
      # Email Configuration (Optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@espaciobd.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Espacio}
      
      # Application URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.espaciobd.com}
      
      # Node Environment
      NODE_ENV: "production"
    
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 90s
    
    command: >
      sh -c "
      set -e
      echo '🚀 Starting Espacio Application...';
      echo '';
      echo '📊 Waiting for PostgreSQL...';
      until pg_isready -h postgres -p 5432 -U ${POSTGRES_USER:-postgres} > /dev/null 2>&1; do
        sleep 2;
      done;
      echo '✓ PostgreSQL is ready';
      echo '';
      echo '🔧 Setting up database schema...';
      npx prisma generate;
      npx prisma db push --accept-data-loss --skip-generate;
      echo '✓ Database schema created';
      echo '';
      echo '🌐 Starting Next.js server on 0.0.0.0:3000...';
      node server.js;
      "
    
    labels:
      # Minimal Traefik labels - Let Dokploy UI handle the rest
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.espacio-app.loadbalancer.server.port=3000"
    
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local