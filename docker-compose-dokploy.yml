  espacio-app:
    build:
      context: ./startup-mvp
      dockerfile: Dockerfile
    container_name: startup-mvp-app
    restart: unless-stopped
    networks:
      - dokploy-network
    depends_on:
      espacio-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@espacio-postgres:5432/startup_mvp?schema=public
    command: >
      sh -c "
      echo 'Waiting for database...';
      until pg_isready -h espacio-postgres -p 5432 -U postgres; do
        sleep 2;
      done;
      echo 'Running Prisma migrations...';
      npx prisma migrate deploy;
      npx prisma generate;
      echo 'Starting app...';
      node server.js;
      "

    environment:
      # Database
      DATABASE_URL: postgresql://postgres:postgres@espacio-postgres:5432/startup_mvp?schema=public
      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-I5p97Jpv0Xr7Zz7Ay8W6+O2eLmBR6N2gllGrZO01Szo=}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      AUTH_TRUST_HOST: "true"
      
      # MinIO
      MINIO_ENDPOINT: espacio-minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-startup-mvp-files}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      
      # Redis (optional)
      REDIS_URL: ${REDIS_URL:-redis://espacio-redis:6379}
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Startup MVP}
      
      # App URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      
      # Node Environment
      NODE_ENV: production
    depends_on:
      espacio-postgres:
        condition: service_healthy
      espacio-minio:
        condition: service_healthy
      
    

  # Redis (optional, if you're using it)
  espacio-redis:
    image: redis:7-alpine
    container_name: startup-mvp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

networks:
  dokploy-network:
    driver: bridge
    external: false


 
# Named volumes for data persistence (Dokploy manages these)
volumes:
  postgres_data:
  minio_data:
  redis_data:
