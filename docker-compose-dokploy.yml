# Load environment variables from .env.docker if it exists
# Otherwise, use default values or environment variables
# To use custom env file: docker-compose --env-file .env.docker up

services:
  # PostgreSQL Database
  espacio-postgres:
    image: postgres:16-alpine
    container_name: startup-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-startup_mvp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # IMPORTANT: Data persists across deployments in ./volumes/postgres
      # This directory is preserved even when containers are recreated
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-network

  # MinIO Object Storage
  espacio-minio:
    image: minio/minio:latest
    container_name: startup-mvp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # CORS Configuration for browser uploads - CRITICAL for file uploads to work
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGIN:-*}
    expose:
      - "9000"
      - "9001"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio-api.rule=Host(`minio.espaciobd.com`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.espaciobd.com`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
    volumes:
      # IMPORTANT: All uploaded files persist across deployments in ./volumes/minio
      # This directory is preserved even when containers are recreated
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - docker-network
      - dokploy-network

  # MinIO Client for bucket initialization
  espacio-minio-setup:
    image: minio/mc:latest
    container_name: startup-mvp-minio-setup
    depends_on:
      espacio-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      echo 'Setting up MinIO bucket...';
      /usr/bin/mc alias set myminio http://espacio-minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-espacio-files} || echo 'Bucket already exists';
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_NAME:-espacio-files} || true;
      /usr/bin/mc anonymous set upload myminio/${MINIO_BUCKET_NAME:-espacio-files} || true;
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_NAME:-espacio-files} || true;
      echo 'MinIO bucket setup complete!';
      exit 0;
      "
    networks:
      - docker-network

  # Next.js Application
  espacio-app:
    build:
      context: ./startup-mvp
      dockerfile: Dockerfile
    container_name: startup-mvp-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@espacio-postgres:5432/${POSTGRES_DB:-startup_mvp}?schema=public
      
      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-I5p97Jpv0Xr7Zz7Ay8W6+O2eLmBR6N2gllGrZO01Szo=}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://dev.espaciobd.com}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      
      # MinIO Configuration - Internal Only (like PostgreSQL)
      # MinIO is accessed internally via Docker network
      # No public URL needed - files are uploaded/downloaded via Next.js API
      MINIO_ENDPOINT: espacio-minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-startup-mvp-files}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://espacio-minio:9000}
      
      # Redis (optional)
      REDIS_URL: ${REDIS_URL:-redis://espacio-redis:6379}
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Startup MVP}
      
      # App URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dev.espaciobd.com}
      
      # Node Environment
      NODE_ENV: production
    depends_on:
      espacio-postgres:
        condition: service_healthy
      espacio-minio:
        condition: service_healthy
    networks:
      - docker-network
      - dokploy-network    
  # Redis (optional, if you're using it)
  espacio-redis:
    image: redis:7-alpine
    container_name: startup-mvp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-network

networks:
  docker-network:
    driver: bridge
  dokploy-network:
    external: true

# CRITICAL: Named volumes for data persistence
# These volumes will NEVER be deleted during normal deployments
# Only explicit "docker-compose down -v" or "docker volume rm" will delete them
# However, we use bind mounts (./volumes/*) so data is on the host filesystem
volumes:
  # These are not actively used since we use bind mounts,
  # but declaring them here for documentation purposes
  # Data is stored in ./volumes/ directory on the host
  postgres-data:
    driver: local
  minio-data:
    driver: local
  redis-data:
    driver: local

