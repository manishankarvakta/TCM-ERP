<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ffERP Biometric Gateway Console</title>
  
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0a12;
    }
    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }
    /* Glow effects */
    .glow-blue {
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.25);
    }
    .glow-purple {
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
    }
    .glow-green {
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }
    .glow-red {
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
    }
    /* Pulse animations */
    .pulse-glow {
      animation: pulse 2s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    /* Flow animation for the active ethernet lines */
    .data-flow-line-wan {
      background: linear-gradient(90deg, #1b1633 0%, #8b5cf6 50%, #1b1633 100%);
      background-size: 200% 100%;
      animation: dataFlow 1.5s linear infinite;
    }
    .data-flow-line-lan {
      background: linear-gradient(90deg, #1b1633 0%, #3b82f6 50%, #1b1633 100%);
      background-size: 200% 100%;
      animation: dataFlow 1.5s linear infinite;
    }
    .data-flow-line-tcp {
      background: linear-gradient(90deg, #121e1a 0%, #10b981 50%, #121e1a 100%);
      background-size: 200% 100%;
      animation: dataFlow 1.5s linear infinite;
    }
    @keyframes dataFlow {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #12101e;
    }
    ::-webkit-scrollbar-thumb {
      background: #312e4c;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4c4775;
    }
  </style>
</head>
<body class="text-gray-200 overflow-hidden h-screen flex flex-col">
  
  <!-- React App Root Container -->
  <div id="root" class="flex-grow flex flex-col"></div>

  <!-- React & ReactDOM from CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for parsing JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- React Logic & UI Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Custom SVG icons representing network topology components - ENLARGED to w-8 h-8 / w-9 h-9
    const CloudServerIcon = ({ active }) => (
      <svg className={`w-8 h-8 transition-colors duration-300 ${active ? 'text-blue-400' : 'text-rose-500/50'}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        <path d="M12 11v6" />
        <path d="M9 14h6" />
      </svg>
    );

    const LocalAppIcon = ({ active }) => (
      <svg className={`w-8 h-8 transition-colors duration-300 ${active ? 'text-violet-400' : 'text-rose-500/50'}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <rect x="2" y="3" width="20" height="14" rx="2" />
        <line x1="8" y1="21" x2="16" y2="21" />
        <line x1="12" y1="17" x2="12" y2="21" />
      </svg>
    );

    const RouterIcon = ({ active }) => (
      <svg className={`w-8 h-8 transition-colors duration-300 ${active ? 'text-sky-400' : 'text-rose-500/50'}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <rect x="2" y="14" width="20" height="6" rx="1" />
        <line x1="6" y1="17" x2="6" y2="17" strokeLinecap="round" />
        <line x1="10" y1="17" x2="10" y2="17" strokeLinecap="round" />
        <line x1="14" y1="17" x2="14" y2="17" strokeLinecap="round" />
        <line x1="18" y1="17" x2="18" y2="17" strokeLinecap="round" />
        <path d="M20 14c0-4.418-3.582-8-8-8S4 9.582 4 14" />
        <path d="M17 14c0-2.761-2.239-5-5-5s-5 2.239-5 5" />
      </svg>
    );

    const FingerprintIcon = ({ active }) => (
      <svg className={`w-9 h-9 transition-colors duration-300 ${active ? 'text-emerald-400' : 'text-rose-500'}`} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <path d="M12 2a10 10 0 0 0-7.38 16.74" />
        <path d="M12 6a6 6 0 0 0-4.43 10.04" />
        <path d="M12 10a2 2 0 0 0-1.48 3.34" />
        <path d="M12 14c.28 0 .5-.22.5-.5V10" />
        <path d="M12 18c.28 0 .5-.22.5-.5V6" />
        <path d="M8 22c.28 0 .5-.22.5-.5v-4" />
        <path d="M16 22c.28 0 .5-.22.5-.5v-4" />
        <path d="M12 22a10 10 0 0 0 8.52-4.74" />
        <path d="M12 22a6 6 0 0 0 5.43-3.96" />
      </svg>
    );

    const DeviceIcon = () => (
      <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 5h10a2 2 0 012 2v10a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2z" />
      </svg>
    );

    const LogIcon = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    );

    const CheckIcon = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
      </svg>
    );

    const RefreshIcon = ({ animate }) => (
      <svg className={`w-4 h-4 ${animate ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8.89M9 17H5v-4" />
      </svg>
    );

    function App() {
      const [status, setStatus] = useState(null);
      const [logs, setLogs] = useState([]);
      const [logFilter, setLogFilter] = useState('ALL');
      const [isPaused, setIsPaused] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [activeTab, setActiveTab] = useState('DEVICES'); // 'DEVICES' or 'STEPS'
      const logContainerRef = useRef(null);

      // 1. Fetch current status data periodically
      const fetchStatus = async () => {
        try {
          const res = await fetch('/status');
          const data = await res.json();
          setStatus(data);
        } catch (e) {
          console.error("Failed to fetch agent status", e);
        }
      };

      useEffect(() => {
        fetchStatus();
        const statusInterval = setInterval(fetchStatus, 15000); // Check every 15s

        // 2. Setup Server-Sent Events (SSE) log stream
        const eventSource = new EventSource('/events');

        eventSource.onmessage = (event) => {
          if (isPaused) return;
          try {
            const newLog = JSON.parse(event.data);
            setLogs(prev => [...prev.slice(-300), newLog]); // Keep last 300 logs
          } catch (e) {
            console.error("Error parsing log event stream", e);
          }
        };

        eventSource.onerror = () => {
          console.warn("EventSource closed. Reconnecting...");
        };

        return () => {
          eventSource.close();
          clearInterval(statusInterval);
        };
      }, [isPaused]);

      // Autoscroll logs window on new message
      useEffect(() => {
        if (logContainerRef.current) {
          logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
        }
      }, [logs]);

      const handleClearLogs = () => {
        setLogs([]);
      };

      const triggerManualSync = async () => {
        setIsSyncing(true);
        try {
          await fetch('/status');
          setTimeout(() => setIsSyncing(false), 2000);
        } catch (e) {
          setIsSyncing(false);
        }
      };

      const filteredLogs = logs.filter(l => {
        if (logFilter === 'ALL') return true;
        if (logFilter === 'ERROR') return l.level === 'ERROR';
        if (logFilter === 'WARN') return l.level === 'WARN';
        if (logFilter === 'INFO') return l.level === 'INFO';
        return true;
      });

      return (
        <div className="flex-grow flex flex-col h-screen overflow-hidden">
          
          {/* Top Header Dashboard */}
          <header className="bg-[#12101f] border-b border-[#24213d] px-6 py-4 flex flex-wrap items-center justify-between gap-4">
            <div className="flex items-center gap-3">
              <div className="bg-violet-600/20 p-2.5 rounded-xl border border-violet-500/30 text-violet-400 glow-purple">
                <DeviceIcon />
              </div>
              <div>
                <h1 className="text-xl font-bold font-outfit tracking-wide text-white">ffERP Biometric Console</h1>
                <p className="text-xs text-gray-400">Gateway ID: <span className="text-violet-400 font-semibold">{status?.gatewayId || "loading..."}</span></p>
              </div>
            </div>

            {/* Stats Overview Cards */}
            <div className="flex items-center gap-4">
              <div className="bg-[#19162c] border border-[#2b274c] px-4 py-2 rounded-xl flex items-center gap-3 min-w-[120px]">
                <div className="text-emerald-400"><CheckIcon /></div>
                <div>
                  <p className="text-[10px] text-gray-400 uppercase font-semibold">Total Logs</p>
                  <p className="text-base font-bold font-outfit text-white">{status?.metrics?.totalCachedLogs ?? 0}</p>
                </div>
              </div>
              <div className="bg-[#19162c] border border-[#2b274c] px-4 py-2 rounded-xl flex items-center gap-3 min-w-[120px]">
                <div className="text-amber-400">
                  <span className="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 pulse-glow"></span>
                </div>
                <div>
                  <p className="text-[10px] text-gray-400 uppercase font-semibold">Pending</p>
                  <p className="text-base font-bold font-outfit text-white">{status?.metrics?.pendingLogs ?? 0}</p>
                </div>
              </div>
              <div className="bg-[#19162c] border border-[#2b274c] px-4 py-2 rounded-xl flex items-center gap-3 min-w-[120px]">
                <div className="text-rose-500">
                  <span className="inline-block w-2.5 h-2.5 bg-rose-500 rounded-full"></span>
                </div>
                <div>
                  <p className="text-[10px] text-gray-400 uppercase font-semibold">Failed</p>
                  <p className="text-base font-bold font-outfit text-white">{status?.metrics?.failedLogs ?? 0}</p>
                </div>
              </div>

              {/* Manual Sync Button */}
              <button 
                onClick={triggerManualSync}
                disabled={isSyncing}
                className="bg-violet-600 hover:bg-violet-500 text-white font-medium text-sm px-4 py-2 rounded-xl transition flex items-center gap-2 glow-purple"
              >
                <RefreshIcon animate={isSyncing} />
                <span>Sync Now</span>
              </button>

              {/* Gateway Status Pulse */}
              <div className="flex items-center gap-2 bg-[#1b2a24] border border-[#294c3d] px-3.5 py-2 rounded-xl">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-glow"></span>
                <span className="text-xs font-bold text-emerald-400 uppercase tracking-wider">Gateway Online</span>
              </div>
            </div>
          </header>

          {/* Main Layout Grid */}
          <main className="flex-grow grid grid-cols-1 lg:grid-cols-5 overflow-hidden">
            
            {/* Left Side: Devices & Tasks list */}
            <section className="lg:col-span-2 bg-[#0e0d16] border-r border-[#24213d] flex flex-col overflow-hidden">
              
              {/* Tab Header Selector */}
              <div className="px-6 py-4 border-b border-[#24213d] bg-[#12101f]/50 flex justify-between items-center">
                <div className="flex gap-2 bg-[#0a080f] p-1 rounded-xl border border-[#23203b]">
                  <button 
                    onClick={() => setActiveTab('DEVICES')}
                    className={`text-xs font-bold uppercase tracking-wider font-outfit px-3 py-1.5 rounded-lg transition ${
                      activeTab === 'DEVICES' 
                        ? 'bg-violet-600 text-white shadow' 
                        : 'text-gray-400 hover:text-white'
                    }`}
                  >
                    Device Network
                  </button>
                  <button 
                    onClick={() => setActiveTab('STEPS')}
                    className={`text-xs font-bold uppercase tracking-wider font-outfit px-3 py-1.5 rounded-lg transition ${
                      activeTab === 'STEPS' 
                        ? 'bg-violet-600 text-white shadow' 
                        : 'text-gray-400 hover:text-white'
                    }`}
                  >
                    Setup Checklist
                  </button>
                </div>
                <span className="text-[10px] text-gray-500">Auto-refresh: 15s</span>
              </div>

              {/* List container */}
              <div className="flex-grow overflow-y-auto p-6">
                {activeTab === 'DEVICES' ? (
                  <div className="space-y-6">
                    {status?.devices?.length === 0 ? (
                      <div className="text-center py-12">
                        <p className="text-gray-500">No active devices configured.</p>
                      </div>
                    ) : (
                      status?.devices?.map((device) => {
                        const isServerOnline = !!status; 
                        const isLocalAppOnline = !!status;
                        const isRouterOnline = !!status; 
                        const isTerminalOnline = device.isReachable;

                        return (
                          <div 
                            key={device.deviceId}
                            className="bg-[#131122] border border-[#2b274c] hover:border-violet-500/40 rounded-2xl p-5 transition-all duration-200 shadow-md relative overflow-hidden flex flex-col gap-4"
                          >
                            
                            {/* VISUAL 4-NODE TOPOLOGY SCHEMATIC - LARGER ICONS & RED INACTIVE STATE COLORING */}
                            <div className="flex items-center justify-between px-2.5 py-4 bg-[#09080e]/40 rounded-2xl border border-[#201d36]/30 relative">
                              
                              {/* Node A: Live Cloud ERP Server */}
                              <div className="flex flex-col items-center gap-1.5 z-10">
                                <div className={`p-3.5 rounded-2xl border relative transition-all duration-300 ${
                                  isServerOnline 
                                    ? 'bg-blue-600/10 border-blue-500/30 text-blue-400 glow-blue' 
                                    : 'bg-red-500/10 border-red-500/20 text-rose-500 glow-red'
                                }`}>
                                  <CloudServerIcon active={isServerOnline} />
                                  <span className={`absolute -top-1 -right-1 w-3 h-3 rounded-full ${isServerOnline ? 'bg-blue-500 pulse-glow' : 'bg-red-500'}`}></span>
                                </div>
                                <span className={`text-[8.5px] font-bold uppercase tracking-wider ${isServerOnline ? 'text-blue-400 font-semibold' : 'text-rose-500/70'}`}>ERP Live</span>
                              </div>

                              {/* Line 1: WAN Internet Link */}
                              <div className="flex-grow h-[3px] mx-0.5 relative overflow-hidden bg-[#201d36] rounded-full">
                                {isServerOnline ? (
                                  <div className="absolute inset-0 data-flow-line-wan"></div>
                                ) : (
                                  <div className="absolute inset-0 bg-red-950/40"></div>
                                )}
                              </div>

                              {/* Node B: Local Client Agent App */}
                              <div className="flex flex-col items-center gap-1.5 z-10">
                                <div className={`p-3.5 rounded-2xl border relative transition-all duration-300 ${
                                  isLocalAppOnline 
                                    ? 'bg-violet-600/10 border-violet-500/30 text-violet-400 glow-purple' 
                                    : 'bg-red-500/10 border-red-500/20 text-rose-500 glow-red'
                                }`}>
                                  <LocalAppIcon active={isLocalAppOnline} />
                                  <span className={`absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full ${isLocalAppOnline ? 'bg-violet-500 pulse-glow' : 'bg-red-500'}`}></span>
                                </div>
                                <span className={`text-[8.5px] font-bold uppercase tracking-wider ${isLocalAppOnline ? 'text-violet-400 font-semibold' : 'text-rose-500/70'}`}>Local App</span>
                              </div>

                              {/* Line 2: LAN Local Link */}
                              <div className="flex-grow h-[3px] mx-0.5 relative overflow-hidden bg-[#201d36] rounded-full">
                                {isRouterOnline ? (
                                  <div className="absolute inset-0 data-flow-line-lan"></div>
                                ) : (
                                  <div className="absolute inset-0 bg-red-950/40"></div>
                                )}
                              </div>

                              {/* Node C: Network Router / Hub */}
                              <div className="flex flex-col items-center gap-1.5 z-10">
                                <div className={`p-3.5 rounded-2xl border relative transition-all duration-300 ${
                                  isRouterOnline 
                                    ? 'bg-sky-600/10 border-sky-500/30 text-sky-400 glow-blue' 
                                    : 'bg-red-500/10 border-red-500/20 text-rose-500 glow-red'
                                }`}>
                                  <RouterIcon active={isRouterOnline} />
                                  <span className={`absolute -top-1 -right-1 w-3 h-3 rounded-full ${isRouterOnline ? 'bg-sky-400 pulse-glow' : 'bg-red-500'}`}></span>
                                </div>
                                <span className={`text-[8.5px] font-bold uppercase tracking-wider ${isRouterOnline ? 'text-sky-400 font-semibold' : 'text-rose-500/70'}`}>Router</span>
                              </div>

                              {/* Line 3: TCP Hardware Link */}
                              <div className="flex-grow h-[3px] mx-0.5 relative overflow-hidden bg-[#201d36] rounded-full">
                                {isTerminalOnline ? (
                                  <div className="absolute inset-0 data-flow-line-tcp"></div>
                                ) : (
                                  <div className="absolute inset-0 bg-red-950/40"></div>
                                )}
                              </div>

                              {/* Node D: Biometric Scanner Hardware */}
                              <div className="flex flex-col items-center gap-1.5 z-10">
                                <div className={`p-3.5 rounded-2xl border relative transition-all duration-300 ${
                                  isTerminalOnline 
                                    ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400 glow-green' 
                                    : 'bg-rose-950/20 border-rose-500/30 text-rose-500 glow-red'
                                }`}>
                                  <FingerprintIcon active={isTerminalOnline} />
                                  <span className={`absolute -top-1 -right-1 w-3.5 h-3.5 rounded-full ${isTerminalOnline ? 'bg-emerald-500 pulse-glow' : 'bg-rose-500'}`}></span>
                                </div>
                                <span className={`text-[8.5px] font-bold uppercase tracking-wider ${isTerminalOnline ? 'text-emerald-400 font-semibold' : 'text-rose-500 font-semibold'}`}>
                                  {device.vendor}
                                </span>
                              </div>
                            </div>

                            {/* TEXT/INFO METADATA DETAILS */}
                            <div className="space-y-3">
                              <div className="flex justify-between items-start">
                                <div>
                                  <h3 className="font-bold text-white tracking-wide text-base">{device.name}</h3>
                                  <p className="text-xs text-gray-400 font-mono mt-0.5">{device.ipAddress}:{device.port || "4370"}</p>
                                </div>
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                  device.vendor.toLowerCase() === 'hikvision' 
                                    ? 'bg-red-500/10 text-red-400 border border-red-500/20' 
                                    : 'bg-blue-500/10 text-blue-400 border border-blue-500/20'
                                }`}>
                                  {device.vendor} Terminal
                                </span>
                              </div>

                              {device.lastError && (
                                <div className="bg-rose-950/20 border border-rose-500/20 rounded-lg p-2.5 text-xs text-rose-400 font-mono flex items-start gap-1.5 leading-relaxed">
                                  <svg className="w-4 h-4 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                  </svg>
                                  <span>{device.lastError}</span>
                                </div>
                              )}

                              <div className="grid grid-cols-2 gap-2 text-xs border-t border-[#23203c] pt-3">
                                <div>
                                  <span className="text-gray-500 block text-[9px] uppercase tracking-wider font-semibold">Serial Number</span>
                                  <span className="text-gray-300 font-mono text-xs">{device.serialNumber || "-"}</span>
                                </div>
                                <div>
                                  <span className="text-gray-500 block text-[9px] uppercase tracking-wider font-semibold">Last Polled</span>
                                  <span className="text-gray-300 text-xs">
                                    {device.lastPulledAt ? new Date(device.lastPulledAt).toLocaleTimeString() : "Never"}
                                  </span>
                                </div>
                              </div>
                            </div>

                          </div>
                        );
                      })
                    )}
                  </div>
                ) : (
                  /* STEPS TASK LIST VIEW */
                  <div className="space-y-4">
                    {status?.steps?.map((step, idx) => (
                      <div key={idx} className="bg-[#131122] border border-[#2b274c] rounded-2xl p-4 flex flex-col gap-2.5 transition-all">
                        <div className="flex items-center gap-3">
                          <span className={`w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold ${
                            step.completed 
                              ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' 
                              : step.inProgress
                                ? 'bg-violet-500/20 text-violet-400 border border-violet-500/40 pulse-glow'
                                : 'bg-gray-800 text-gray-500 border border-gray-700'
                          }`}>
                            {step.completed ? '✓' : idx + 1}
                          </span>
                          <span className={`text-sm font-bold font-outfit ${step.completed ? 'text-gray-400 font-normal line-through' : 'text-white'}`}>
                            {step.title}
                          </span>
                        </div>
                        {step.items && step.items.length > 0 && (
                          <div className="pl-9 space-y-2 border-l border-[#24213d] ml-3 mt-1">
                            {step.items.map((sub, sIdx) => (
                              <div key={sIdx} className="flex items-center gap-2.5 text-xs">
                                <span className={`w-2 h-2 rounded-full ${
                                  sub.completed 
                                    ? 'bg-emerald-500' 
                                    : sub.inProgress 
                                      ? 'bg-violet-500 pulse-glow' 
                                      : 'bg-gray-700'
                                }`}></span>
                                <span className={sub.completed ? 'text-gray-500 line-through' : 'text-gray-300'}>
                                  {sub.title}
                                </span>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </section>

            {/* Right Side: Activity Console */}
            <section className="lg:col-span-3 bg-[#07060f] flex flex-col overflow-hidden">
              <div className="px-6 py-4 border-b border-[#1c1a2f] bg-[#0c0a1a] flex flex-wrap items-center justify-between gap-3">
                <h2 className="text-sm font-bold uppercase tracking-wider text-gray-300 font-outfit flex items-center gap-2">
                  <LogIcon />
                  Realtime Activity log
                </h2>

                {/* Console Controls */}
                <div className="flex items-center gap-2">
                  {/* Category filter */}
                  <div className="bg-[#12101e] border border-[#2b274c] rounded-lg p-0.5 flex gap-1 text-[10px] font-semibold">
                    {['ALL', 'INFO', 'WARN', 'ERROR'].map(f => (
                      <button
                        key={f}
                        onClick={() => setLogFilter(f)}
                        className={`px-2 py-1 rounded transition ${logFilter === f ? 'bg-violet-600 text-white shadow' : 'text-gray-400 hover:text-white'}`}
                      >
                        {f}
                      </button>
                    ))}
                  </div>

                  {/* Pause/Play button */}
                  <button 
                    onClick={() => setIsPaused(!isPaused)}
                    className={`p-1.5 rounded-lg border text-xs transition ${
                      isPaused 
                        ? 'bg-amber-600/10 border-amber-500/30 text-amber-400' 
                        : 'bg-[#12101e] border-[#2b274c] text-gray-400 hover:text-white'
                    }`}
                    title={isPaused ? "Resume log stream" : "Pause log stream"}
                  >
                    {isPaused ? (
                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                      </svg>
                    ) : (
                      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                      </svg>
                    )}
                  </button>

                  {/* Clear logs */}
                  <button 
                    onClick={handleClearLogs}
                    className="p-1.5 rounded-lg border border-[#2b274c] bg-[#12101e] text-gray-400 hover:text-white transition"
                    title="Clear console"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                  </button>
                </div>
              </div>

              {/* Terminal log body */}
              <div 
                ref={logContainerRef}
                className="flex-grow p-6 overflow-y-auto font-mono text-xs leading-relaxed space-y-2.5 bg-[#040308]"
              >
                {filteredLogs.length === 0 ? (
                  <div className="text-gray-600 italic py-8">
                    Listening for device activities... (press "Sync Now" to trigger manual check logs)
                  </div>
                ) : (
                  filteredLogs.map((log, index) => {
                    let levelColor = 'text-blue-400';
                    let bgGlow = '';
                    if (log.level === 'WARN') {
                      levelColor = 'text-amber-400';
                    } else if (log.level === 'ERROR') {
                      levelColor = 'text-rose-500 font-bold';
                      bgGlow = 'bg-rose-950/20 border-l-2 border-rose-500 pl-1.5';
                    } else if (log.message.includes('success') || log.message.includes('Successfully')) {
                      levelColor = 'text-emerald-400';
                    }

                    return (
                      <div key={index} className={`transition-all duration-150 py-0.5 ${bgGlow}`}>
                        <span className="text-gray-500 font-light select-none mr-2">
                          {new Date(log.timestamp).toLocaleTimeString()}
                        </span>
                        <span className={`font-bold mr-2 ${levelColor}`}>
                          [{log.level}]
                        </span>
                        <span className="text-gray-300 break-all">{log.message}</span>
                        {log.error && (
                          <div className="text-rose-400/80 pl-8 mt-1 whitespace-pre-wrap select-text font-light text-[11px] border-l border-rose-950">
                            {log.error}
                          </div>
                        )}
                      </div>
                    );
                  })
                )}
              </div>
            </section>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
