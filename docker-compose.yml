# Load environment variables from .env.docker if it exists
# Otherwise, use default values or environment variables
# To use custom env file: docker-compose --env-file .env.docker up

services:
  # PostgreSQL Database
  espacio-postgres:
    image: postgres:16-alpine
    container_name: startup-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-startup_mvp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # IMPORTANT: Data persists across container restarts in ./volumes/postgres
      # This directory is preserved even when containers are recreated
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # MinIO Object Storage
  espacio-minio:
    image: minio/minio:latest
    container_name: startup-mvp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # CORS Configuration for browser uploads
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # IMPORTANT: All uploaded files persist across container restarts in ./volumes/minio
      # This directory is preserved even when containers are recreated
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - app-network

  # MinIO Client for bucket initialization
  espacio-minio-setup:
    image: minio/mc:latest
    container_name: startup-mvp-minio-setup
    depends_on:
      espacio-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://espacio-minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME:-startup-mvp-files} || true;
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_NAME:-startup-mvp-files} || true;
      /usr/bin/mc anonymous set upload myminio/${MINIO_BUCKET_NAME:-startup-mvp-files} || true;
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_NAME:-startup-mvp-files} || true;
      exit 0;
      "
    networks:
      - app-network

  # Next.js Application
  espacio-app:
    build:
      context: ./startup-mvp
      dockerfile: Dockerfile
    container_name: startup-mvp-app
    restart: unless-stopped
    ports:
      # Host port defaults to 3001 to avoid clashing with local `npm run dev` (often uses 3000)
      - "${APP_PORT:-3001}:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@espacio-postgres:5432/${POSTGRES_DB:-startup_mvp}?schema=public
      
      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-I5p97Jpv0Xr7Zz7Ay8W6+O2eLmBR6N2gllGrZO01Szo=}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${APP_PORT:-3001}}
      
      # MinIO
      MINIO_ENDPOINT: espacio-minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-startup-mvp-files}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      
      # Redis (optional)
      REDIS_URL: ${REDIS_URL:-redis://espacio-redis:6379}
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Startup MVP}
      
      # App URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${APP_PORT:-3001}}
      
      # Node Environment
      NODE_ENV: production
    depends_on:
      espacio-postgres:
        condition: service_healthy
      espacio-minio:
        condition: service_healthy
    networks:
      - app-network
    command: >
      sh -c "
      echo 'Starting application...';
      node server.js;
      "
  # echo 'Waiting for database to be ready...';
  # sleep 10;
  # echo 'Running database migrations (SAFE MODE - preserves data)...';
  # npx prisma migrate deploy;
  # if [ $$? -eq 0 ]; then
  #   echo '✅ Database migrations completed successfully';
  #   echo '✅ All existing data preserved';
  # else
  #   echo '❌ Database migrations failed';
  #   exit 1;
  # fi;

  # Redis (optional, if you're using it)
  espacio-redis:
    image: redis:7-alpine
    container_name: startup-mvp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

# CRITICAL: Named volumes for data persistence
# These volumes will NEVER be deleted during normal deployments
# Only explicit "docker-compose down -v" or "docker volume rm" will delete them
# However, we use bind mounts (./volumes/*) so data is on the host filesystem
volumes:
  # These are not actively used since we use bind mounts,
  # but declaring them here for documentation purposes
  # Data is stored in ./volumes/ directory on the host
  postgres-data:
    driver: local
  minio-data:
    driver: local
  redis-data:
    driver: local

