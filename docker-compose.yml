# Load environment variables from .env.docker if it exists
# Otherwise, use default values or environment variables
# To use custom env file: docker-compose --env-file .env.docker up

services:
  # PostgreSQL Database
  fferp-postgres:
    image: postgres:16-alpine
    container_name: fferp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-startup_mvp}
      TZ: Asia/Dhaka
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # IMPORTANT: Data persists across container restarts in ./volumes/postgres
      # This directory is preserved even when containers are recreated
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Next.js Application
  fferp-app:
    build:
      context: ./startup-mvp
      dockerfile: Dockerfile
    container_name: fferp-app
    restart: unless-stopped
    ports:
      # Host port defaults to 3000 to avoid clashing with local `npm run dev` (often uses 3000)
      - "${APP_PORT:-3000}:3000"
    environment:
      # Timezone
      TZ: Asia/Dhaka

      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@fferp-postgres:5432/${POSTGRES_DB:-startup_mvp}?schema=public
      
      # Auth.js / NextAuth
      # Canonical public URL used by Auth.js and for email links
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-I5p97Jpv0Xr7Zz7Ay8W6+O2eLmBR6N2gllGrZO01Szo=}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET:-I5p97Jpv0Xr7Zz7Ay8W6+O2eLmBR6N2gllGrZO01Szo=}}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:${APP_PORT:-3000}}
      # Auth.js v5 uses AUTH_URL / AUTH_TRUST_HOST – mirror NEXTAUTH_URL and trust the Docker host
      AUTH_URL: ${AUTH_URL:-http://localhost:${APP_PORT:-3000}}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      
      # Redis (optional)
      REDIS_URL: ${REDIS_URL:-redis://fferp-redis:6379}
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Startup MVP}
      
      # App URL
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:${APP_PORT:-3000}}
      
      # Node Environment
      NODE_ENV: production
    volumes:
      - ./volumes/uploads:/app/uploads
    depends_on:
      fferp-postgres:
        condition: service_healthy
    networks:
      - app-network

  # Redis (optional, if you're using it)
  fferp-redis:
    image: redis:7-alpine
    container_name: fferp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

# CRITICAL: Named volumes for data persistence
# These volumes will NEVER be deleted during normal deployments
# Only explicit "docker-compose down -v" or "docker volume rm" will delete them
# However, we use bind mounts (./volumes/*) so data is on the host filesystem
volumes:
  # These are not actively used since we use bind mounts,
  # but declaring them here for documentation purposes
  # Data is stored in ./volumes/ directory on the host
  postgres-data:
    driver: local
  redis-data:
    driver: local

